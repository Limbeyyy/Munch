# Munch, in front of Daphne.
#
# Install to /etc/nginx/sites-available/munch and symlink into
# sites-enabled. Replace munch.example.np throughout with the name this
# is actually served under - the same name that goes in ALLOWED_HOSTS
# and CSRF_TRUSTED_ORIGINS, or Django will refuse requests nginx has
# happily passed it.

upstream munch_asgi {
    server 127.0.0.1:8000;
    keepalive 32;
}

# A websocket is a normal request that asks to stop being one. Without
# this map the Connection header is dropped on the way through and the
# upgrade never happens: the room, the live transcript and the guest
# hub all connect, hang, and fall back to nothing.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name munch.example.np;

    # Uploaded resources and exported spreadsheets go through here.
    client_max_body_size 100M;

    access_log /var/log/nginx/munch.access.log;
    error_log  /var/log/nginx/munch.error.log;

    # -- The built frontend ------------------------------------------
    #
    # Served at the root. Django's own root redirects to the allauth
    # login page, so it must not be proxied: the app would never load.
    root /opt/munch/Munch-frontend/build;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Create React App fingerprints these, so they can be cached hard.
    # index.html must not be - it is what names the current bundle,
    # and a cached one keeps pointing at the last deploy's files.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # -- Django's own assets -----------------------------------------
    #
    # Under /django-static/, not /static/, because the frontend owns
    # that prefix. config/settings/production.py sets STATIC_URL to
    # match; the two have to be changed together or the admin, the
    # browsable API and swagger all load unstyled.
    #
    # Note the path: STATIC_ROOT and MEDIA_ROOT sit inside config/,
    # not at the repository root, because BASE_DIR points at the
    # settings package's parent.
    location /django-static/ {
        alias /opt/munch/config/staticfiles/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /opt/munch/config/media/;
        expires 7d;
    }

    # -- The websockets ----------------------------------------------
    location /ws/ {
        proxy_pass http://munch_asgi;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A room is quiet between one talk and the next, and the
        # client's own heartbeat is only every fifteen seconds. The
        # default sixty would cut an idle attendee off repeatedly.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering off;
    }

    # -- The API and everything else Django answers -------------------
    location ~ ^/(api|admin|accounts|api-auth|swagger|redoc)(/|$) {
        proxy_pass http://munch_asgi;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # What tells Django the request arrived over TLS. Without it
        # every absolute URL it builds comes back http:// and secure
        # cookies are refused - see SECURE_PROXY_SSL_HEADER.
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
        proxy_redirect off;
    }
}

# -- TLS ---------------------------------------------------------------
#
# Once a certificate exists, `sudo certbot --nginx -d munch.example.np`
# rewrites the block above to redirect to 443 and adds the listener.
# Then set SECURE_SSL_REDIRECT=True in .env.prod and restart
# munch.target - in that order. Turning it on first makes every
# request a redirect to a port nothing is listening on yet.
