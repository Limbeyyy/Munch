# Copy to /etc/wsl.conf inside the distro, then from Windows:
#
#   wsl --shutdown
#
# and start the distro again. The shutdown is required - wsl.conf is
# read when the distro boots, and WSL keeps it running for a while
# after the last shell closes.

[boot]
# Off by default in WSL2. Every Munch service is a systemd unit, so
# without this there is nothing to start them, nothing to restart one
# that dies, and no journal to read afterwards.
# Needs WSL 0.67.6 or newer: check with `wsl --version` in PowerShell,
# and `wsl --update` if it is older.
systemd=true

[network]
# WSL rewrites both of these on every boot unless told not to, which
# loses any nameserver or hosts entry added by hand.
generateResolvConf = true
generateHosts = true

[interop]
# Nothing here calls out to Windows binaries, and leaving the Windows
# PATH appended puts a few hundred Windows directories in front of
# every subprocess the app spawns.
enabled = false
appendWindowsPath = false

[automount]
enabled = true
options = "metadata,umask=22,fmask=11"
